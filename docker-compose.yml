services:
  db:
    image: postgres:16-alpine
    container_name: sales_dashboard_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: sales_dashboard
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./apps/api/sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  adminer:
    image: adminer:4
    container_name: sales_dashboard_adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      - db

volumes:
  pg_data:
